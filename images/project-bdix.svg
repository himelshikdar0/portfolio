<svg xmlns=http://www.w3.org/2000/svg width=800 height=500 viewBox=0 0 800 500>
  <defs>
    <linearGradient id=bg x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% style=stop-color:#06101c/>
      <stop offset=100% style=stop-color:#0a1a2e/>
    </linearGradient>
    <linearGradient id=net x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% style=stop-color:#06b6d4/>
      <stop offset=100% style=stop-color:#3b82f6/>
    </linearGradient>
  </defs>
  <rect width=800 height=500 fill=url(#bg)/>
  <!-- Network Hub Nodes -->
  <g stroke=url(#net) stroke-width=2 fill=none>
    <line x1=400 y1=160 x2=300 y2=230/>
    <line x1=400 y1=160 x2=500 y2=230/>
    <line x1=300 y1=230 x2=350 y2=290/>
    <line x1=500 y1=230 x2=450 y2=290/>
    <line x1=350 y1=290 x2=450 y2=290/>
  </g>
  <circle cx=400 cy=160 r=22 fill=url(#net)/>
  <circle cx=300 cy=230 r=16 fill=#3b82f6/>
  <circle cx=500 cy=230 r=16 fill=#3b82f6/>
  <circle cx=350 cy=290 r=14 fill=#06b6d4/>
  <circle cx=450 cy=290 r=14 fill=#06b6d4/>
  <text x=400 y=380 font-family=system-ui, sans-serif font-size=28 font-weight=bold fill=#ffffff text-anchor=middle letter-spacing=2>BDIX ULTRA CONNECT</text>
  <text x=400 y=415 font-family=system-ui, sans-serif font-size=14 fill=#06b6d4 text-anchor=middle letter-spacing=3>NETWORK &amp; PEERING DIAGNOSTICS</text>
</svg>
