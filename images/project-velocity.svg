<svg xmlns=http://www.w3.org/2000/svg width=800 height=500 viewBox=0 0 800 500>
  <defs>
    <linearGradient id=bg x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% style=stop-color:#120808/>
      <stop offset=100% style=stop-color:#1e0e0a/>
    </linearGradient>
    <linearGradient id=speed x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% style=stop-color:#f97316/>
      <stop offset=100% style=stop-color:#eab308/>
    </linearGradient>
  </defs>
  <rect width=800 height=500 fill=url(#bg)/>
  <!-- 3D Perspective Road -->
  <polygon points=380,100 420,100 650,320 150,320 fill=#1b1b22 opacity=0.6/>
  <line x1=400 y1=100 x2=400 y2=320 stroke=#eab308 stroke-width=4 stroke-dasharray=15 15/>
  <!-- Speed lines -->
  <line x1=120 y1=160 x2=220 y2=160 stroke=#f97316 stroke-width=3 opacity=0.7/>
  <line x1=80 y1=200 x2=200 y2=200 stroke=#f97316 stroke-width=4 opacity=0.8/>
  <line x1=680 y1=160 x2=580 y2=160 stroke=#f97316 stroke-width=3 opacity=0.7/>
  <line x1=720 y1=200 x2=600 y2=200 stroke=#f97316 stroke-width=4 opacity=0.8/>
  <!-- Motorcycle Icon / Helmet -->
  <circle cx=400 cy=220 r=30 fill=url(#speed)/>
  <ellipse cx=400 cy=225 rx=20 ry=10 fill=#120808/>
  <text x=400 y=380 font-family=system-ui, sans-serif font-size=28 font-weight=bold fill=#ffffff text-anchor=middle letter-spacing=2>VELOCITY RIDER 3D</text>
  <text x=400 y=415 font-family=system-ui, sans-serif font-size=14 fill=#f97316 text-anchor=middle letter-spacing=3>THREE.JS 3D BIKE RACING GAME</text>
</svg>
