  <circle cx="175" cy="140" r="3" fill="#64748b" opacity="0.3"/>
  <circle cx="190" cy="140" r="3" fill="#64748b" opacity="0.3"/>
  <!-- Content cards -->
  <rect x="130" y="250" width="170" height="80" rx="8" fill="#1a1a24" stroke="#1e1e2a" stroke-width="0.5"/>
  <rect x="145" y="265" width="40" height="40" rx="8" fill="#10b981" opacity="0.15"/>
  <rect x="145" y="265" width="40" height="40" rx="8" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.3"/>
  <rect x="200" y="270" width="80" height="6" rx="3" fill="#334155"/>
  <rect x="200" y="282" width="60" height="4" rx="2" fill="#1e293b"/>

  <rect x="315" y="250" width="170" height="80" rx="8" fill="#1a1a24" stroke="#1e1e2a" stroke-width="0.5"/>
  <rect x="330" y="265" width="40" height="40" rx="8" fill="#06b6d4" opacity="0.15"/>
  <rect x="330" y="265" width="40" height="40" rx="8" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.3"/>
  <rect x="385" y="270" width="80" height="6" rx="3" fill="#334155"/>
  <rect x="385" y="282" width="60" height="4" rx="2" fill="#1e293b"/>

  <rect x="500" y="250" width="170" height="80" rx="8" fill="#1a1a24" stroke="#1e1e2a" stroke-width="0.5"/>
  <rect x="515" y="265" width="40" height="40" rx="8" fill="#3b82f6" opacity="0.15"/>
  <rect x="515" y="265" width="40" height="40" rx="8" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.3"/>
  <rect x="570" y="270" width="80" height="6" rx="3" fill="#334155"/>
  <rect x="570" y="282" width="60" height="4" rx="2" fill="#1e293b"/>
