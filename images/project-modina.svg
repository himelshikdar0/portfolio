<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#111118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="35%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <!-- Geometric pattern -->
  <g opacity="0.05" stroke="#06b6d4" stroke-width="0.5" fill="none">
    <circle cx="100" cy="100" r="80"/>
    <circle cx="700" cy="100" r="80"/>
    <circle cx="100" cy="400" r="80"/>
    <circle cx="700" cy="400" r="80"/>
    <path d="M100,20 L100,180 M20,100 L180,100"/>
    <path d="M700,20 L700,180 M620,100 L780,100"/>
  </g>
  <!-- Browser mockup -->
  <rect x="180" y="80" width="440" height="320" rx="10" fill="#111118" stroke="#1e1e2a" stroke-width="1"/>
  <rect x="180" y="80" width="440" height="28" rx="10" fill="#1a1a24"/>
  <rect x="180" y="96" width="440" height="12" fill="#1a1a24"/>
  <circle cx="198" cy="94" r="3.5" fill="#ef4444"/>
  <circle cx="211" cy="94" r="3.5" fill="#eab308"/>
  <circle cx="224" cy="94" r="3.5" fill="#22c55e"/>
  <rect x="270" y="88" width="180" height="12" rx="6" fill="#252530"/>
  <!-- Islamic geometric header -->
  <rect x="200" y="120" width="400" height="80" rx="6" fill="#0f1419"/>
  <g transform="translate(400,160)" opacity="0.3">
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="#06b6d4" stroke-width="1"/>
    <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="none" stroke="#10b981" stroke-width="0.5"/>
  </g>
  <text x="400" y="155" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="bold" fill="white">AI Modina</text>
  <text x="400" y="172" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#06b6d4">Islamic Web Application</text>
  <!-- Content sections -->
  <rect x="200" y="215" width="120" height="80" rx="6" fill="#1a1a24"/>
  <rect x="215" y="228" width="40" height="40" rx="20" fill="#06b6d4" opacity="0.15" stroke="#06b6d4" stroke-width="0.5" opacity="0.2"/>
  <rect x="215" y="278" width="90" height="4" rx="2" fill="#334155"/>
  <rect x="340" y="215" width="120" height="80" rx="6" fill="#1a1a24"/>
  <rect x="355" y="228" width="40" height="40" rx="20" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
  <rect x="355" y="278" width="90" height="4" rx="2" fill="#334155"/>
  <rect x="480" y="215" width="120" height="80" rx="6" fill="#1a1a24"/>
  <rect x="495" y="228" width="40" height="40" rx="20" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="0.5" opacity="0.2"/>
  <rect x="495" y="278" width="90" height="4" rx="2" fill="#334155"/>
