<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#111118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Browser mockup -->
  <rect x="100" y="60" width="600" height="380" rx="12" fill="#111118" stroke="#1e1e2a" stroke-width="1"/>
  <rect x="100" y="60" width="600" height="35" rx="12" fill="#1a1a24"/>
  <rect x="100" y="83" width="600" height="12" fill="#1a1a24"/>
  <circle cx="120" cy="77" r="4" fill="#ef4444"/>
  <circle cx="136" cy="77" r="4" fill="#eab308"/>
  <circle cx="152" cy="77" r="4" fill="#22c55e"/>
  <rect x="200" y="70" width="200" height="14" rx="7" fill="#252530"/>
