  <rect x="200" y="315" width="400" height="4" rx="2" fill="#1e293b"/>
  <rect x="200" y="327" width="350" height="4" rx="2" fill="#1e293b"/>
  <rect x="200" y="339" width="280" height="4" rx="2" fill="#1e293b"/>
  <rect x="200" y="355" width="100" height="24" rx="12" fill="url(#accent)" opacity="0.6"/>
