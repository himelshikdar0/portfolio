<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#111118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#10b981" stroke-width="0.5">
    <line x1="0" y1="0" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="800" y2="300"/>
    <line x1="0" y1="100" x2="700" y2="500"/>
    <line x1="0" y1="200" x2="600" y2="500"/>
  </g>
  <!-- Water waves -->
  <path d="M0,350 Q100,330 200,350 T400,350 T600,350 T800,350 L800,500 L0,500 Z" fill="url(#water)"/>
  <path d="M0,370 Q100,350 200,370 T400,370 T600,370 T800,370 L800,500 L0,500 Z" fill="url(#water)" opacity="0.5"/>
  <!-- Fish icons -->
  <g transform="translate(200,280)" fill="#10b981" opacity="0.6">
    <ellipse cx="0" cy="0" rx="25" ry="10"/>
    <polygon points="25,0 35,-8 35,8"/>
    <circle cx="-10" cy="-3" r="2" fill="#0a0a0f"/>
  </g>
  <g transform="translate(500,310)" fill="#06b6d4" opacity="0.4">
    <ellipse cx="0" cy="0" rx="20" ry="8"/>
    <polygon points="20,0 28,-6 28,6"/>
    <circle cx="-8" cy="-2" r="1.5" fill="#0a0a0f"/>
  </g>
  <!-- Dashboard mockup -->
  <rect x="250" y="120" width="300" height="180" rx="8" fill="#111118" stroke="#1e1e2a" stroke-width="1"/>
  <rect x="260" y="130" width="280" height="20" rx="4" fill="#1a1a24"/>
  <circle cx="275" cy="140" r="3" fill="#ef4444"/>
  <circle cx="287" cy="140" r="3" fill="#eab308"/>
  <circle cx="299" cy="140" r="3" fill="#22c55e"/>
  <!-- Chart bars -->
  <rect x="275" y="200" width="20" height="80" rx="3" fill="#10b981" opacity="0.7"/>
  <rect x="310" y="170" width="20" height="110" rx="3" fill="#06b6d4" opacity="0.7"/>
  <rect x="345" y="220" width="20" height="60" rx="3" fill="#3b82f6" opacity="0.7"/>
  <rect x="380" y="190" width="20" height="90" rx="3" fill="#10b981" opacity="0.7"/>
  <rect x="415" y="160" width="20" height="120" rx="3" fill="#06b6d4" opacity="0.7"/>
  <rect x="450" y="210" width="20" height="70" rx="3" fill="#3b82f6" opacity="0.7"/>
  <rect x="485" y="180" width="20" height="100" rx="3" fill="#10b981" opacity="0.7"/>
  <!-- Title -->
  <text x="400" y="430" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#64748b" letter-spacing="3">AQUA FARM SAAS</text>
  <rect x="350" y="445" width="100" height="2" rx="1" fill="url(#accent)"/>
</svg>
