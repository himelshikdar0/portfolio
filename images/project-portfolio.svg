  <text x="400" y="379" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#475569">Portfolio</text>
  <!-- Tech badges -->
  <text x="400" y="430" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#64748b" letter-spacing="3">PERSONAL PORTFOLIO</text>
  <rect x="350" y="445" width="100" height="2" rx="1" fill="url(#accent)"/>
