<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#111118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <!-- AI brain/circuit pattern -->
  <g transform="translate(400,200)" opacity="0.15" stroke="#10b981" stroke-width="1" fill="none">
    <circle cx="0" cy="0" r="60"/>
    <circle cx="0" cy="0" r="40"/>
    <circle cx="0" cy="0" r="20"/>
    <line x1="-60" y1="0" x2="-100" y2="0"/>
    <line x1="60" y1="0" x2="100" y2="0"/>
    <line x1="0" y1="-60" x2="0" y2="-100"/>
    <line x1="0" y1="60" x2="0" y2="100"/>
    <line x1="-42" y1="-42" x2="-70" y2="-70"/>
    <line x1="42" y1="-42" x2="70" y2="-70"/>
    <line x1="-42" y1="42" x2="-70" y2="70"/>
    <line x1="42" y1="42" x2="70" y2="70"/>
    <circle cx="-100" cy="0" r="5" fill="#10b981"/>
    <circle cx="100" cy="0" r="5" fill="#06b6d4"/>
    <circle cx="0" cy="-100" r="5" fill="#3b82f6"/>
    <circle cx="0" cy="100" r="5" fill="#10b981"/>
    <circle cx="-70" cy="-70" r="4" fill="#06b6d4"/>
    <circle cx="70" cy="-70" r="4" fill="#3b82f6"/>
    <circle cx="-70" cy="70" r="4" fill="#3b82f6"/>
    <circle cx="70" cy="70" r="4" fill="#10b981"/>
  </g>
  <!-- Desktop window -->
  <rect x="200" y="110" width="400" height="260" rx="10" fill="#111118" stroke="#1e1e2a" stroke-width="1"/>
  <rect x="200" y="110" width="400" height="28" rx="10" fill="#1a1a24"/>
  <rect x="200" y="126" width="400" height="12" fill="#1a1a24"/>
  <circle cx="218" cy="124" r="3.5" fill="#ef4444"/>
  <circle cx="231" cy="124" r="3.5" fill="#eab308"/>
  <circle cx="244" cy="124" r="3.5" fill="#22c55e"/>
  <!-- Chat interface -->
  <rect x="220" y="148" width="280" height="24" rx="12" fill="#1a1a24"/>
  <text x="235" y="164" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#64748b">LEO: How can I help you today?</text>
  <rect x="300" y="182" width="280" height="24" rx="12" fill="#10b981" opacity="0.15"/>
  <text x="315" y="198" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#10b981">User: Schedule my tasks for today</text>
  <rect x="220" y="216" width="280" height="24" rx="12" fill="#1a1a24"/>
  <text x="235" y="232" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#64748b">LEO: Done! I've organized your...</text>
  <rect x="300" y="250" width="280" height="24" rx="12" fill="#10b981" opacity="0.15"/>
  <text x="315" y="266" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#10b981">User: Play some music</text>
  <rect x="220" y="284" width="280" height="24" rx="12" fill="#1a1a24"/>
  <text x="235" y="300" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#64748b">LEO: Now playing...</text>
  <!-- Voice wave -->
  <g transform="translate(400,330)" opacity="0.4">
    <rect x="-40" y="-8" width="4" height="16" rx="2" fill="#10b981"/>
    <rect x="-28" y="-14" width="4" height="28" rx="2" fill="#06b6d4"/>
    <rect x="-16" y="-20" width="4" height="40" rx="2" fill="#10b981"/>
    <rect x="-4" y="-12" width="4" height="24" rx="2" fill="#3b82f6"/>
    <rect x="8" y="-18" width="4" height="36" rx="2" fill="#06b6d4"/>
    <rect x="20" y="-10" width="4" height="20" rx="2" fill="#10b981"/>
    <rect x="32" y="-16" width="4" height="32" rx="2" fill="#3b82f6"/>
  </g>
  <!-- Title -->
  <text x="400" y="430" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#64748b" letter-spacing="3">LEO AI ASSISTANT</text>
  <rect x="350" y="445" width="100" height="2" rx="1" fill="url(#accent)"/>
</svg>
