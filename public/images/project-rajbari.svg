<svg xmlns=http://www.w3.org/2000/svg width=800 height=500 viewBox=0 0 800 500>
  <defs>
    <linearGradient id=bg x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% style=stop-color:#071217/>
      <stop offset=100% style=stop-color:#0b2126/>
    </linearGradient>
    <linearGradient id=gold x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% style=stop-color:#f59e0b/>
      <stop offset=100% style=stop-color:#10b981/>
    </linearGradient>
  </defs>
  <rect width=800 height=500 fill=url(#bg)/>
  <!-- Map Grid & Waves -->
  <g opacity=0.08 stroke=#10b981 stroke-width=1 fill=none>
    <circle cx=400 cy=220 r=160/>
    <circle cx=400 cy=220 r=110/>
    <circle cx=400 cy=220 r=60/>
    <line x1=200 y1=220 x2=600 y2=220/>
    <line x1=400 y1=50 x2=400 y2=390/>
  </g>
  <!-- River curve -->
  <path d=M150,380 Q300,320 450,360 T750,310 stroke=#06b6d4 stroke-width=4 fill=none opacity=0.4/>
  <!-- Compass / Pin Icon -->
  <g transform=translate(400,210)>
    <path d=M0,-50 L15,0 L0,50 L-15,0 Z fill=url(#gold)/>
    <circle cx=0 cy=0 r=8 fill=#ffffff/>
  </g>
  <!-- District Landmark Building -->
  <path d=M340,320 L400,270 L460,320 L440,360 L360,360 Z fill=none stroke=#f59e0b stroke-width=2 opacity=0.6/>
  <text x=400 y=420 font-family=system-ui, sans-serif font-size=28 font-weight=bold fill=#ffffff text-anchor=middle letter-spacing=2>UNSEEN RAJBARI</text>
  <text x=400 y=450 font-family=system-ui, sans-serif font-size=14 fill=#06b6d4 text-anchor=middle letter-spacing=3>HERITAGE &amp; INTERACTIVE MAPS</text>
</svg>
