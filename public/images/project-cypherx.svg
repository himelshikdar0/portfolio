  <path d=M250,220 L330,190 L380,140 L430,160 L520,80 fill=none stroke=#06b6d4 stroke-width=3/>
  <text x=400 y=380 font-family=system-ui, sans-serif font-size=28 font-weight=bold fill=#ffffff text-anchor=middle letter-spacing=2>CYPHERX EXCHANGE</text>
