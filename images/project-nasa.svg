<svg xmlns=http://www.w3.org/2000/svg width=800 height=500 viewBox=0 0 800 500>
  <defs>
    <linearGradient id=bg x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% style=stop-color:#050816/>
      <stop offset=100% style=stop-color:#0b132b/>
    </linearGradient>
    <linearGradient id=fire x1=0% y1=0% x2=0% y2=100%>
      <stop offset=0% style=stop-color:#f59e0b/>
      <stop offset=100% style=stop-color:#ef4444/>
    </linearGradient>
  </defs>
  <rect width=800 height=500 fill=url(#bg)/>
  <!-- Stars -->
  <circle cx=200 cy=100 r=2 fill=#ffffff opacity=0.8/>
  <circle cx=300 cy=80 r=1.5 fill=#ffffff opacity=0.6/>
  <circle cx=580 cy=120 r=2 fill=#ffffff opacity=0.9/>
  <circle cx=650 cy=200 r=1.5 fill=#ffffff opacity=0.5/>
  <circle cx=220 cy=280 r=2 fill=#ffffff opacity=0.7/>
  <!-- Planet with Ring -->
  <circle cx=260 cy=180 r=30 fill=#3b82f6 opacity=0.7/>
  <ellipse cx=260 cy=180 rx=55 ry=12 fill=none stroke=#60a5fa stroke-width=2 opacity=0.5/>
  <!-- Rocket Ship -->
  <g transform=translate(400,170)>
    <path d=M0,-60 C15,-30 20,20 18,50 L-18,50 C-20,20 -15,-30 0,-60 Z fill=#ffffff/>
    <circle cx=0 cy=-10 r=8 fill=#0b132b/>
    <path d=M-18,30 L-35,60 L-18,55 Z fill=#ef4444/>
    <path d=M18,30 L35,60 L18,55 Z fill=#ef4444/>
    <!-- Flame -->
    <path d=M-10,50 Q0,85 10,50 Z fill=url(#fire)/>
  </g>
  <text x=400 y=380 font-family=system-ui, sans-serif font-size=28 font-weight=bold fill=#ffffff text-anchor=middle letter-spacing=2>NASA MISSION TRAINER</text>
  <text x=400 y=415 font-family=system-ui, sans-serif font-size=14 fill=#38bdf8 text-anchor=middle letter-spacing=3>STEM SPACE APPS SIMULATOR</text>
</svg>
